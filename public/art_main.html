    <div class="header">Paintings
      <div class="art_body">
        <img loading="lazy" src="assets/art/paintings/acceptance4.jpg" onclick="changeIMG(this)" data-title="Acceptance Part 4" data-desc="Finished! The middle blue ring is meant to be the corona of the universe lookin' back on the bird, and you can see a bit of the bird's reflection but its eyes are absent. The corona represent desolation, and likewise the bird's wings are a powerful red but even they are fading into the trees around it. The bird knows it will always lose in the battle against eternity, and yet it smiles. Its mortality gives it the determination to enjoy its precious life to the fullest! Also, I was using my thighs for wiping paint off. Runnin' the AC in the hot summers is too expensive, and I'm very at home with lounging around wearin' nothing but what I was born with, anyways. Hooray, nudism! Give it a try, sometime!" data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/acceptance3.jpg" onclick="changeIMG(this)" data-title="Acceptance Part 3" data-desc="Oh, also for this painting I decided it would be fun to challenge myself by using only my hands to paint. It's very messy and fun, as good art should be! The white streak in the middle is meant to be a lightning bolt, as inspired by earlier in the day, where I was out walking and just admiring the humbling power of the storm above me." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/acceptance2.jpg" onclick="changeIMG(this)" data-title="Acceptance Part 2" data-desc="Here I'm gettin' the basic colors down. I really love the color scheme of the red, green, n' blue. Also, the bird lookin' like the red angry bird isn't an accident, as my sister and I love to vocal stim my going like uwAAAAGH HEEEHeheh, just like the red angry bird always used to say." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/acceptance1.jpg" onclick="changeIMG(this)" data-title="Acceptance Part 1 - 7.18.26" data-desc="Was listening to Monster Train ost n' suddenly got hit by an artistic mood. Wanted to paint something to capture the feeling of 'looking god in the eye and accepting my place in the universe'. On the top-left is the thumbnail sketch where i'm plannin' out the composition. The bird character is inspired by the cardinal from Birds of a Feather (a 2 player game on my itch.io), as seen in the bottom-left. On the right is the pencil sketch on the canvas." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/overstimulation_painting_small.jpg" onclick="changeIMG(this)" data-title="Overstimulation" data-desc="Sometimes life can be a lot to handle. Sometimes I feel overwhelmingly scared, excited, angry, and manic. Hungry, in need of a shower, stuck in the past n' dreading the future, it's easy to feel crushed from the weight of it all. Lately, I've found it's a good idea to check how I'm doing on HALT (Am I Hungry? Angry? Lonely? Tired?), ya gotta take care of your most basic of needs first n' foremost. I also of course, find art as a great way to meditate on negative feelings. I've also grown to love this little wormsona for us! I think more people should try their hand at vent art." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/2Wolves5.jpg" onclick="changeIMG(this)" data-title="Two Wolves part 5, Finalization" data-desc="Finished! Even though some aspects of this painting are a little jank, ya gotta shoot for 'done' instead of 'perfect'. I had fun making it for my luv n' that's all that counts! The words 'gay' also feature colors from the non-binary, bisexual, and polyamorous pride flags." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/2Wolves4.jpg" onclick="changeIMG(this)" data-title="Two Wolves part 4, Coloooor" data-desc="The eyes were especially tricky to get right as even subtle lines could alter the expressions. Here, both wolves look kinda tired (I mean, so am I most of the time, but still)." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/2Wolves3.jpg" onclick="changeIMG(this)" data-title="Two Wolves part 3, Color them dogs" data-desc="It was at this point I realized that the left wolf's dark fur would make it a challenge to define their form." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/2Wolves2.jpg" onclick="changeIMG(this)" data-title="Two Wolves part 2, Background" data-desc="Not much to say here other than I like the foresty green n' stony gray color scheme of the background." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/2Wolves1.jpg" onclick="changeIMG(this)" data-title="Two Wolves part 1, Preliminary - 7.2.24" data-desc="A painting I made for my wonderful partner. I was happy about how the sketchbook preliminary (left) turned out, but the proportions turned out a bit different when transferring it to canvas. Ah well!" data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/FinishedZenGardenPainting-min.jpg" onclick="changeIMG(this)" data-title="Zen Garden Painting part 11, Finalization - 4.27.24" data-desc="The final iteration! Here the background and sand received some love. The lines in the sand was the most daunting part to me, hence why it got saved for last. It wasn't as bad as I anticipated, of course. I made Orange Arm Man bigger in his reflection so that I could fit his details easier, and I'm glad I did. Prezzy and Peasint Monstre's expressions ended up looking ticked off, but considering they are being confronted by Orange Arm Man, I kept it. I'm overall very proud of this painting, it was fun to make, even with some parts not turning out how I'd expect!" data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/ZenGardenPainting6-min.jpg" onclick="changeIMG(this)" data-title="Zen Garden Painting part 10, Details" data-desc="I love the improvement the tree leaves and bamboo fences received in this iteration." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/ZenGardenPainting5-min.jpg" onclick="changeIMG(this)" data-title="Zen Garden Painting part 9, Shadows" data-desc="Shadows! Unfortunately, the shadows ended up being kind of jank, as I didn't pay enough attention to the fact that the painting's composition was too different from the 3D model composition. All things considered, the shadows didn't turn out too bad, though in retrospect I woulda skewed Orange Arm Man's shadow more to the left to match up with the angle of the other shadows." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/ZenGardenPainting4-min.jpg" onclick="changeIMG(this)" data-title="Zen Garden Painting part 8, Reds n' Pinks" data-desc="I think around this point I realized I had drawn the mirror ball closer to the ground compared to its floating 3D counterpart, so I had to improvise how its reflection looked. Still, I was already loving how this painting was coming together, even the mirror ball and all its complexity." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/ZenGardenPainting3-min.jpg" onclick="changeIMG(this)" data-title="Zen Garden Painting part 7, Grays n' Greens" data-desc="The color of the bamboo fence in the background ended up greener than I originally envisioned, but I ended up sticking with this idea since I liked that it stood out more from the sand." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/ZenGardenPainting2-min.jpg" onclick="changeIMG(this)" data-title="Zen Garden Painting part 6, First Color" data-desc="Getting started with actually painting is often the biggest mental hurdle for me, as the work needed to paint can feel daunting at first. I find that it helps to focus on just getting some color onto the canvas, working on painting the rougher background features before worrying about the foreground." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/zenGardenPainting1-min.jpg" onclick="changeIMG(this)" data-title="Zen Garden Painting part 5, the Canvas" data-desc="Now that I had a composition that I liked, it was time to start puttin' it onto a canvas! I held my phone up to my left eye with a picture of the 3D modeled scene, while I let my right eye focus on the canvas as a way to 'overlay' the two in my brain, allowing me to roughly plot out where all the objects would go. If I wanted a more consistent n' accurate replication of the 3D model, I could have used something like grid lines to help line things up, but frankly I usually have more fun with art when I just eyeball things. Mistakes often lead to interesting ideas, and give art character." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/zen_garden_WIP4-min.png" onclick="changeIMG(this)" data-title="Zen Garden Painting part 4, Finalized Model" data-desc="I adjusted Prezzy and Peasint Monstre's positions so I could play with their shadows and reflections. At the last minute, I ended up adding Orange Arm Man into the scene, because I loved the idea of a character only visible through their shadow and reflection." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/zen_garden_WIP2-min.png" onclick="changeIMG(this)" data-title="Zen Garden Painting part 3, More Modeling" data-desc="I played around with some ideas for posing Prezzy and Peasint Monstre. Even though I didn't go with this idea in the end, them both sharing the shade of a tree is quite cute. I didn't like how messy the reflective object on the right looked, so I ended up changing it into a simpler design later on." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/zen_garden_WIP-min.png" onclick="changeIMG(this)" data-title="Zen Garden Painting part 2, Modeling" data-desc="The 1st Blender model idea for the zen garden. I found a procedural zen garden sand effect using nodes, made by u/Oofletss520 which you can find here: https://www.reddit.com/r/blender/comments/zoz7r5/i_made_procedural_zen_garden_so_you_dont_have_to/" data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/ZenGardenPreliminarySketch-min.jpg" onclick="changeIMG(this)" data-title="Zen Garden Painting part 1, Preliminary Sketch - 4.25.24" data-desc="Have you seen the original unpixelated versions of the Minecraft paintings made by Kristoffer Zetterstrand? Zetterstrand made them by first modeling a scene in Blender, then painting the scene once he was satisfied with the composition. So, I wanted to try a similar technique! I knew I wanted to make a zen garden scene with my two scrunglos, Prezzy and Peasint Monstre, hanging out, so I made a preliminary sketch to get a rough idea of what I wanted." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/Ralsei6Final-min.jpg" onclick="changeIMG(this)" data-title="Ralsei Smoking a Fat Dart Painting part 7, Finalization - 6.20.23" data-desc="Finished! I love how this turned out, I've printed stickers of this painting to give out to strangers, it's a pretty big hit at cannabis dispensery I like to go to. I've considered maybe selling prints of this, since my friends have shown interest in buyin' one." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/Ralsei5-min.jpg" onclick="changeIMG(this)" data-title="Ralsei Painting part 6" data-desc="Now Ralsei can properly enjoy his blunt! I really like this iteration because Ralsei looks like a character in a beloved childrens' book." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/Ralsei4-min.jpg" onclick="changeIMG(this)" data-title="Ralsei Painting part 5" data-desc="Ralsei has no mouth yet he must smoke. I like how the subtle pink/blue on the face gives it shape, even if it looks a little terrifying without any facial features yet, haha." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/Ralsei3-min.jpg" onclick="changeIMG(this)" data-title="Ralsei Painting part 4" data-desc="An amorphous white blob wearing a green pillowcase appears! The shape of Ralsei is looking pretty good. I also like how small Ralsei is in proportion to the background." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/Ralsei2-min.jpg" onclick="changeIMG(this)" data-title="Ralsei Painting part 3" data-desc="I really like how the background's depth became more apparent in this iteration. I figured out I could use my hands to smudge some of the black acrylic paint to help make the center gradually fade into inky blackness. The colored outlines on the trees helped to make them stand out less from the background. The only thing I could complain about is the blue grass, particularly the stuff in the foreground. There mighta been something I could do to make the blades direction/size/shade make more sense, but I at least like how it looks at the root of the trees." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/Ralsei1-min.jpg" onclick="changeIMG(this)" data-title="Ralsei Painting part 2" data-desc="A decent start on plotting out the background elements. Also, I hope you weren't attached to the mercedez benz that was present in the preliminary, as I ended up dropping it from the final painting, as I wanted to keep the focus of the painting on Ralsei." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/paintings/RalseiPreliminary-min.jpg" onclick="changeIMG(this)" data-title="Ralsei Smoking a Fat Dart Painting part 1, Preliminary Sketch - 6.18.23" data-desc="Chicory: A Colorful Tale taught me how fun it can be to make paintings. I've done some mini-canvas paintings in the past, but I hadn't really done any larger paintings on my own 'til now! And what better way to start than by making a meme painting of Ralsei from Deltarune smoking a fat dart?" data-imgno="0" class="galleryimg">
      </div>

    <div class="header">3D Models
      <div class="art_body">
        <!-- <img loading="lazy" src="assets/art/3D/PinkTree.gif" onclick="changeIMG(this)" data-title="TEMP - ??" data-desc="TEMP DESC" data-imgno="0" class="galleryimg"> -->
        <img loading="lazy" src="assets/art/3D/PrezzyStunned.gif" onclick="changeIMG(this)" data-title="Prezzy Stunned - ~10.20.24" data-desc="(4/4) Importing these animations into Godot was INCREDIBLY tedious. In Blender, I used some 'driver bones' I could move up and down to change what set of eyes/mouth/etc. Prezzy uses. If I wanted the driver bones to work the same in Godot, I would have to write shader code to tell Godot exactly what eye/mouth/etc. texture to use depending on the position of the driver bones. I DID manage to get it working in this way, but it was incredibly tedious and if I were to make any changes to the animation I'd have to start over a lot of work. It was a fun test, but I'll have to find a much smoother workflow, perhaps animating the face directly in Godot, for instance." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/3D/PrezzyBash.gif" onclick="changeIMG(this)" data-title="Prezzy Bash - ~10.20.24" data-desc="(3/4) My favorite animation of the bunch, the idea being players would have a bash move to allow them to cross horizontal distances quickly, and of course, grief the hell out of your friends by repeatedly ramming into them at turbo speed." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/3D/PrezzyJumpAndFallTest.gif" onclick="changeIMG(this)" data-title="Prezzy jump and fall - ~10.20.24" data-desc="(2/4) More character animations, the idea being that these would be used for a 3D platformer existential mario party clone, called 'A Brush with Death.'" data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/3D/prezzy-walk-test.gif" onclick="changeIMG(this)" data-title="Prezzy walk cutout animation test - ~10.20.24" data-desc="(1/4) A mixed media test of sketches colored digitally, then turned into cutout animation in Blender." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/3D/EelctricAquarium.png" onclick="changeIMG(this)" data-title="Eelctric Aquarium - 7.23.24" data-desc="A piece I made for newberiance during Art Fight! Eelctric was too charming of a creature design to pass up. The mirror background is inspired by an aquarium I went to with a Jellyfish exhibit that likewise had infinite reflections... and because I wanted to make another mirror box piece!" data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/3D/potion_spin_fast.gif" onclick="changeIMG(this)" data-title="Potion - 6.23.24" data-desc="A mix between 3D models with 2D permanent marker textures, similar to the Cottage piece. I am making a game about chimeras, so the game's art will be a chimera of different styles!" data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/3D/MinesMcgeetaunt.gif" onclick="changeIMG(this)" data-title="Mines Mcgee, taunt - 5.20.24" data-desc="Mines Mcgee being extra silly. You can shoot heart bullets in the tank game, so I thought it'd be funny if shooting enemies with them will make them do funny animations like this." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/3D/MinesMcgee.gif" onclick="changeIMG(this)" data-title="Mines Mcgee, mine pickup - 5.16.24" data-desc="A design for an enemy for the tank game I've been working on... Though it's questionable to call Mines Mcgee an 'enemy' since they are more interested in collecting mines than they are fighting." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/3D/orangeArmManSprint.gif" onclick="changeIMG(this)" data-title="Orange Arm Man - 4.19.24" data-desc="Another drawing of my sister's that I made 3D. Orange Arm Man became sadistic after going crazy from the fact that he was named 'Orange Arm Man' despite his lack of arms. The only thing he hates more than his lack of arms is you; every second you're not running he's only getting closer!!" data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/3D/PinkTree.gif" onclick="changeIMG(this)" data-title="Pink Tree - 3.26.24" data-desc="A wavy pink tree I made for the tank game, but which I like as its own standalone asset. I originally made the tree leaves with photos of cherry tree branches to try for a more photorealistic look, but I didn't like how it turned out (plus a lot of the photorealistic details would have been lost on the game's top-down camera, anyways). So, I went with a more stylized look based on this bush tutorial: https://www.youtube.com/watch?v=K7o3gt9D26g" data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/3D/bird_statue_spin.gif" onclick="changeIMG(this)" data-title="Bird Statue - 2.23.24" data-desc="A 3D model I made for my sister's b-day! The original 2D bird statue design draws heavy inspiration from the Chozo from Metroid." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/3D/Cottage.png" onclick="changeIMG(this)" data-title="Cottage - 1.13.24" data-desc="A test where all of the textures of these 3D models were drawn with pencil and sharpie by yours truly. I hadn't finished making this scene, as evident by the lack of walls and the jank textures on the fireplace, but I still like how it turned out, I'm considering making a short game in this style." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/3D/peasintTank.png" onclick="changeIMG(this)" data-title="Peasint Monstre Tank - 12.16.23" data-desc="Peasint Monstre riding confidentally into battle atop a tank. Made for the local pvp/co-op game: 'All Tanked Up on a Thursday Night,' you can check it out in the games tab of this website's main page!" data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/3D/garf_dramatic_lighting.png" onclick="changeIMG(this)" data-title="Garf w/ Dramatic Lighting - 11.7.23" data-desc="This is probably one of my favorite models, and considering the reactions I get whenever I hand out stickers of this to strangers, it's a lot of other folks' favorite models, too! The model can be found on my tumblr if you want to use it for yourself. Also, please take a look at this video my sister made using the garf model: https://www.tumblr.com/lucy-the-pirate/733556188872048640/yes-yes-i-love-this-a-beautiful-story-of-an?source=share" data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/3D/pinkiepiespin.gif" onclick="changeIMG(this)" data-title="Ponk - 10.30.23" data-desc="Good god you have no idea how much I was cackling like a hyena while I was making this! Also big shoutouts to the WiggleBones addon for Blender for letting me make this Pinkie Pie Pumpkin model ungodly jiggly. For context, see this post: https://www.tumblr.com/lucy-the-pirate/732671698807160832/i-was-inspired-to-practice-uv-editing-in-blender?source=share " data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/3D/mirror2.png" onclick="changeIMG(this)" data-title="Mirror Test 2 - 9.24.23" data-desc="The same model as the first mirror test, only in the dark." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/3D/mirror.png" onclick="changeIMG(this)" data-title="Mirror Test 1 - 9.24.23" data-desc="Have you ever seen an infinite mirror box in real life? They're very trippy n' cool, so I found a tutorial to make my own. Tutorial in question: https://www.youtube.com/watch?v=h57Dah4Q9yc" data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/3D/waterToyRender.png" onclick="changeIMG(this)" data-title="Water Toy - 9.7.23" data-desc="I really like those ring-toss water toy games I had as a kid, so I wanted to model one." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/3D/SquidRender.png" onclick="changeIMG(this)" data-title="Squid Sculpt 2 - 8.15.23" data-desc="Some more tests with the same squid sculpture. I made the sculpt while following along with this tutorial: https://www.youtube.com/watch?v=KIT07EAb-tY" data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/3D/CellShadedSquidRender.png" onclick="changeIMG(this)" data-title="Squid Sculpt 1 - 8.15.23" data-desc="One of my first Blender sculptures. I like how the empty eye socket and cell shading make this look like something you'd see in Hylics 2." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/3D/possum.png" onclick="changeIMG(this)" data-title="Possum in Bisexual Lighting - 7.8.23" data-desc="The first Blender model I ever made! Wanna learn Blender yourself? Give this tutorial a whirl: https://www.youtube.com/watch?v=sbCW0Cs7aI8" data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/3D/PizzaRatMinecraft.png" onclick="changeIMG(this)" data-title="Pizza Rat - 3.19.21" data-desc="A pizza rat I made (left) using the Chisels and Bits Minecraft mod, also featuring my model rat (right) from the Rats mod." data-imgno="0" class="galleryimg">
      </div>
    </div>
      
    <div class="header">Chicory: a Colorful Tale (Some light spoilers ahead)
      <div class="art_body">
        <img loading="lazy" src="assets/art/chicory/firstMemory.gif" onclick="changeIMG(this)" data-title="First Memory (Prompt)" data-desc="There's a side-quest in Chicory where you can make paintings, some of them the player is given a prompt to draw, and some of them being a grayscale painting that you're meant to remake with color. The prompt for this was 'draw one of your first memories.' Since Wind Waker is one of the earliest games I clearly remember, I drew one of my brother's favorite Wind Waker memes." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/chicory/chicory_FluffyFluffySheep.gif" onclick="changeIMG(this)" data-title="Fluffy, Fluffy Sheep (Recreation)" data-desc="The original painting feels nice to look at, so I felt like recreating this one as best I could. I did hide some Baba Is You characters in the background, though." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/chicory/chicory_Friend.gif" onclick="changeIMG(this)" data-title="Friend (Prompt)" data-desc="This might be one of my favorite Chicory paintings I made. Let me paint the context for you: I was stoned and hanging out with my brother, Sam, then I see the painting prompt of 'Draw a friend.' So, drawing Sam seemed like a no-brainer. One problem: the color palette I got was mostly greens. The painting took a lot of weird turns, Sam became a rock statue covered in moss that also had Shrek ears and was maybe also an Angry Birds pig. I leaned heavily into the greens and did my damnedest to make something a Ghibli-esque nature scene. I think it turned out pretty damn good!" data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/chicory/chicory_LettingGo.gif" onclick="changeIMG(this)" data-title="Letting Go (Recreation)" data-desc="Not much I wanna say for this one, other than I like that the knight's gold helmet with red horns looks a bit like Lemon Demon. It was kinda hard to figure out a good way to use the palette I got, but I like the end result." data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/chicory/ChicoryPainting.png" onclick="changeIMG(this)" data-title="Chicory Portrait" data-desc="A portrait of the titular Chicory. The cool S in the bottom-left was a reoccuring joke during our (my brother and myself) playthrough of the game. Also I have headcannoned Chicory as someone who enjoys a marry wanna every now and then if you know what I mean" data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/chicory/ChicoryScrappyDoo.png" onclick="changeIMG(this)" data-title="Scrappy Doo in a Lobster Costume" data-desc="Scrappy Doo looks so handsome in his lobster costume!" data-imgno="0" class="galleryimg">
        <img loading="lazy" src="assets/art/chicory/cookingCozy.gif" onclick="changeIMG(this)" data-title="Cooking Cozy (Recreation)" data-desc="I love the original Cooking Cozy painting, but I couldn't help but put a goofy twist on this recreation of it. In the game's story, the player is meant to restore color to some old paintings. I hope no one minds if the painting looks like Morshu, now!" data-imgno="0" class="galleryimg">

<script>
  function kremling_death_sound() {
      var audio = new Audio('https://www.mariowiki.com/images/9/9d/Kremling_SFX_1.oga');
      audio.play();
  }

  var id = null;
  var art_banner_pos = 70;
  function animateArtBucketUp() {
    var bucket = document.getElementById("ArtBanner");
    console.log("(up) art_banner_pos is:", art_banner_pos);
    clearInterval(id);
    id = setInterval(frame, 10);
    function frame() {
      if (art_banner_pos <= 0) {
        clearInterval(id);
      }
      else {
        art_banner_pos -= 3;
        bucket.style.backgroundPositionY = art_banner_pos + "px";
      }
    }
  }

  function animateArtBucketDown() {
    var bucket = document.getElementById("ArtBanner");
    console.log("(down) art_banner_pos is:", art_banner_pos);
    clearInterval(id);
    id = setInterval(frame, 10);
    function frame() {
      if (art_banner_pos >= 70) {
        clearInterval(id);
      }
      else {
        art_banner_pos += 2;
        bucket.style.backgroundPositionY = art_banner_pos + "px";
      }
    }
  }

//The following code is based on what is found at: https://im-ashl.neocities.org/galleryhead

    var gPoints = [];//Gallery points. Indicates the FIRST element of the start of each gallery.
    var gLastPoints = [];
    var gNames = ["main","doodles","old","cursed"]; // Filled in w/ names of gallery
    var gIMG = []; // The first image of every gallery.
    var gLastIMG = [];
    var simg = 5; // The current image number. 
    var sele; // The current image element.

    function getVIMG () {
        var viewbox = document.getElementById("viewbox");
        var viewimg = document.getElementById("viewimg");
        var viewdesc = document.getElementById("viewdesc");
        var viewtitle = document.getElementById("viewtitle");
    }
    function setIMG(p1) { // Sets the current image, current title, and current description - given an image passed by "this".
        viewimg.src = p1.src;

        viewtitle.textContent = p1.dataset.title;
        viewdesc.textContent = p1.dataset.desc;
        simg = p1.dataset.imgno;
        sele = p1;
        const element = document.getElementById("viewimg");
        element.scrollIntoView(true)
    }     
    function changeGallery(p1, p2) { // Should also change the image to the first element of this gallery
        var galleries = document.getElementsByClassName("galleryholder");
        var gname = "g" + p1;
        var catchTab = 0; 
        for (var i = 0; i < galleries.length; i++) {
            galleries[i].style.display = "none";
            if (galleries[i].id == gname) {
                galleries[i].style.display = "inline-block";
                changeIMG(gIMG[i]);
                catchTab = i;
            }
        }
        var tabs = document.getElementsByClassName("tabsingle");
        
        for (var i = 0; i < tabs.length; i++) {
            tabs[i].id = "unselectedTab";
            
        }
        tabs[catchTab].id = "selectedTab";
        
    }

    function getMyGalleryName (p1) { // Given an int, find which gallery this IMG belongs to.
    var galleryName = "undefined";
    var found = 0; 
        for (var k = 0; k < gNames.length - 1; k++) {
            if (found == 0) {
                if (p1 < gPoints[k + 1]) {
                    galleryName = gNames[k];
                    found++;
                }
            }
        }
        if (found == 0) { // Last thing in gallery
            galleryName = gNames[gNames.length - 1];
        }
        return galleryName;
    }
    function getMyGalleryNo (p1) { // Given an int, find which gallery this IMG belongs to.
    var galleryNo = 0;
    var found = 0; 
        for (var k = 0; k < gNames.length - 1; k++) {
            if (found == 0) {
                if (p1 < gPoints[k + 1]) {
                    galleryNo = k;
                    found++;
                }
            }
        }
        if (found == 0) { // Last thing in gallery
            galleryNo = (gPoints.length - 1);
        }
        return galleryNo;
    }
    function init() {
        //Give every image a number within its gallery, and what gallery it belongs to.
        var galleries = document.getElementsByClassName("galleryholder"); 
        var myIMGno = 0;
        for (var i = 0; i < galleries.length; i++) { // For every gallery...
            var images = galleries[i].getElementsByTagName('IMG');
            gPoints[i] = myIMGno; 
            gIMG[i] = images[0];
            var jHold = 0; 
            for (var j = 0; j < images.length; j++) {
                images[j].dataset.imgno = myIMGno; 
                images[j].className = "galleryimg"
                myIMGno++;
                jHold++;
            }
            gLastPoints[i] = myIMGno - 1;
            gLastIMG[i] = images[images.length - 1];
            changeGallery('main');
        }
    }
    function changeIMG(p1) {
        getVIMG();
        setIMG(p1);
        viewbox.style.display = "block"; // Reveal display block, even if not done yet.
    }
    function shiftIMG(p1) { // ack curses me messy code :|
        getVIMG();
        var myNo = getMyGalleryNo(simg);
        if (p1 == 1) {// Going Forwards...
            if ((simg) == gLastPoints[myNo]) {
                setIMG(gIMG[myNo]);
            }
            else { // keep moving forwards!
                var sneet = sele.nextElementSibling;
                while (sneet.nodeName != "IMG") {
                    sneet = sneet.nextElementSibling;
                }
                setIMG(sneet);
            }
        }
        else if (p1 == -1) {
            if ((simg) == gPoints[myNo]) {
                setIMG(gLastIMG[myNo]);
            }
            else { // keep moving forwards!
                var sneet = sele.previousElementSibling;
                while (sneet.nodeName != "IMG") {
                    sneet = sneet.previousElementSibling;
                }
                setIMG(sneet);
            }
        }
    }   
</script>
